<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Beholder Academy</title>
  <meta name="description" content="Faça login no Beholder Academy para acessar seu painel de aluno ou responsável.">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
      position: relative;
      overflow: hidden;
    }

    .login-page::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(123, 47, 247, 0.15), transparent 70%);
      top: -100px;
      right: -100px;
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
    }

    .login-page::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(0, 212, 170, 0.1), transparent 70%);
      bottom: -80px;
      left: -80px;
      border-radius: 50%;
      animation: float 8s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(20px, -30px); }
    }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 3rem;
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-logo h1 {
      font-family: var(--font-heading);
      font-size: 2rem;
      font-weight: 900;
    }

    .login-logo p {
      color: var(--text-secondary);
      margin-top: 0.5rem;
      font-size: 0.95rem;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-group label {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .form-group input, .form-group select {
      padding: 0.875rem 1rem;
      border: 2px solid var(--border-subtle);
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 1rem;
      background: var(--bg-primary);
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 3px rgba(123, 47, 247, 0.1);
    }

    .type-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .type-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      padding: 1.25rem;
      border: 2px solid var(--border-subtle);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.2s;
      background: var(--bg-primary);
    }

    .type-option:hover {
      border-color: var(--brand-primary);
      background: var(--bg-secondary);
    }

    .type-option.selected {
      border-color: var(--brand-primary);
      background: rgba(123, 47, 247, 0.08);
      box-shadow: 0 0 0 3px rgba(123, 47, 247, 0.12);
    }

    .type-option .type-icon {
      font-size: 2rem;
    }

    .type-option .type-label {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-primary);
    }

    .type-option .type-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
    }

    .login-btn {
      padding: 1rem;
      background: linear-gradient(135deg, var(--brand-primary), #9B4DFF);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-family: var(--font-heading);
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      letter-spacing: 0.02em;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(123, 47, 247, 0.3);
    }

    .login-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .login-error {
      color: #EF4444;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      display: none;
    }

    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .login-footer a {
      color: var(--brand-primary);
      text-decoration: none;
      font-weight: 600;
    }

    /* Vinculação pai-filho */
    .link-child-group {
      display: none;
    }

    .link-child-group.visible {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    @media (max-width: 480px) {
      .login-card { margin: 1rem; padding: 2rem; }
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <h1>Beholder <span class="logo-highlight">Academy</span></h1>
        <p>Entre para acompanhar seu progresso</p>
      </div>

      <form class="login-form" id="login-form" onsubmit="return false;">
        <div class="form-group">
          <label for="login-name">Seu nome</label>
          <input type="text" id="login-name" placeholder="Ex: João Silva" required autocomplete="off" maxlength="50">
        </div>

        <div class="form-group">
          <label>Você é:</label>
          <div class="type-selector">
            <div class="type-option" data-type="aluno" id="opt-aluno">
              <span class="type-icon">🧑‍🎓</span>
              <span class="type-label">Aluno</span>
              <span class="type-desc">Estude, ganhe XP e conquistas</span>
            </div>
            <div class="type-option" data-type="responsavel" id="opt-responsavel">
              <span class="type-icon">👨‍👩‍👧</span>
              <span class="type-label">Responsável</span>
              <span class="type-desc">Acompanhe o progresso</span>
            </div>
          </div>
        </div>

        <div class="form-group link-child-group" id="link-child-group">
          <label for="child-name">Nome do aluno vinculado</label>
          <input type="text" id="child-name" placeholder="Ex: Maria Silva" maxlength="50">
        </div>

        <div class="login-error" id="login-error">Preencha todos os campos.</div>

        <button type="submit" class="login-btn" id="login-btn" disabled>Entrar</button>
      </form>

      <div class="login-footer">
        <a href="index.html">← Voltar para o site</a>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // Dark mode
      var stored = localStorage.getItem('beholder_theme');
      if (stored) document.documentElement.setAttribute('data-theme', stored);
      else if (window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', 'dark');

      var nameInput = document.getElementById('login-name');
      var childInput = document.getElementById('child-name');
      var childGroup = document.getElementById('link-child-group');
      var loginBtn = document.getElementById('login-btn');
      var loginError = document.getElementById('login-error');
      var selectedType = null;

      // Type selection
      document.querySelectorAll('.type-option').forEach(function(opt) {
        opt.addEventListener('click', function() {
          document.querySelectorAll('.type-option').forEach(function(o) { o.classList.remove('selected'); });
          opt.classList.add('selected');
          selectedType = opt.getAttribute('data-type');

          // Show child name field for responsável
          if (selectedType === 'responsavel') {
            childGroup.classList.add('visible');
          } else {
            childGroup.classList.remove('visible');
          }

          validateForm();
        });
      });

      // Validate form
      function validateForm() {
        var nameOk = nameInput.value.trim().length >= 2;
        var typeOk = selectedType !== null;
        var childOk = selectedType !== 'responsavel' || childInput.value.trim().length >= 2;
        loginBtn.disabled = !(nameOk && typeOk && childOk);
        loginError.style.display = 'none';
      }

      nameInput.addEventListener('input', validateForm);
      childInput.addEventListener('input', validateForm);

      // Submit
      document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();

        var name = nameInput.value.trim();
        if (!name || !selectedType) {
          loginError.textContent = 'Preencha todos os campos.';
          loginError.style.display = 'block';
          return;
        }

        var userData = {
          name: name,
          type: selectedType,
          linkedTo: selectedType === 'responsavel' ? childInput.value.trim() : null,
          loginDate: new Date().toISOString()
        };

        localStorage.setItem('beholder_user', JSON.stringify(userData));

        // Redirect based on type
        if (selectedType === 'aluno') {
          window.location.href = 'painel.html';
        } else {
          window.location.href = 'responsavel.html';
        }
      });

      // Check if already logged in
      var existing = localStorage.getItem('beholder_user');
      if (existing) {
        try {
          var user = JSON.parse(existing);
          if (user.name && user.type) {
            nameInput.value = user.name;
            var opt = document.querySelector('[data-type="' + user.type + '"]');
            if (opt) opt.click();
            if (user.linkedTo) childInput.value = user.linkedTo;
          }
        } catch(e) {}
      }
    })();
  </script>
</body>
</html>
